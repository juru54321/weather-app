<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Activity Guide</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      color: #2a2a2a;
      padding: 60px;
      text-align: center;
    }

    h2 {
      font-size: 28px;
      color: #1565c0;
      margin-bottom: 25px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 240px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-left: 10px;
      background-color: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0d47a1;
    }

    #message {
      margin-top: 30px;
      padding: 16px;
      font-size: 18px;
      background-color: #ffffff;
      border-left: 4px solid #1565c0;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: inline-block;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <h2>Weather Activity Guide</h2>
  <input type="text" id="weatherInput" placeholder="Enter weather (e.g., sunny)" />
  <button onclick="checkWeather()">Check</button>

  <div id="message">Enter a weather condition to get activity suggestions.</div>

  <script>
    function checkWeather() {
      const input = document.getElementById("weatherInput").value.trim().toLowerCase();
      const message = document.getElementById("message");

      if (input === "sunny") {
        message.textContent = "It's sunny outside. Great day for a walk, a picnic, or any outdoor sports.";
      } else if (input === "rainy") {
        message.textContent = "Rainy weather. A good time to read, bake, or watch a movie indoors.";
      } else if (input === "cloudy") {
        message.textContent = "Cloudy skies. Consider visiting a museum, going for a calm stroll, or journaling.";
      } else if (input === "snowy") {
        message.textContent = "Snowy conditions. Try indoor workouts, warm drinks, or building a snowman if it's safe.";
      } else {
        message.textContent = "Sorry, that condition isn't recognized. Try sunny, rainy, cloudy, or snowy.";
      }
    }
  </script>

</body>
</html>
